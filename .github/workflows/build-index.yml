name: Build post and log index

on:
  push:
    branches: [main]
    paths:
      - "posts/**.md"
      - "logs/**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build indexes
        run: python3 scripts/build_index.py
      - name: Commit indexes
        run: |
          git config user.name "index-bot"
          git config user.email "index-bot@users.noreply.github.com"
          git add posts/index.json logs/index.json
          git diff --staged --quiet || git commit -m "Update post and log index"
          git push
